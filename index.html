<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"/>
<meta name="theme-color" content="#07090e"/>
<meta name="description" content="ONE STUDIO MASTER — Professional Audio Engineering & Restoration"/>
<title>ONE STUDIO MASTER</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#05070c;--bg2:#0a1018;--elev:rgba(16,24,38,.62);--elev2:rgba(22,32,48,.55);
  --glass:rgba(255,255,255,.05);--glass2:rgba(255,255,255,.045);
  --line:rgba(255,255,255,.10);--line2:rgba(255,255,255,.16);
  --text:#eef3fb;--muted:#8e99ae;--faint:#5e677c;
  --accent:#4ad4e0;--accent2:#7eb4ff;--accent3:#d4b36a;
  --ok:#3dce8a;--warn:#e0b04a;--danger:#e24a5b;--rec:#e24a5b;
  --glow:rgba(74,212,224,.22);--shadow:0 20px 60px rgba(0,0,0,.48);
  --r:16px;--r2:12px;--r3:8px;
  --nav:78px;--top:58px;--bot:96px;--side:360px;
  --font:Manrope,system-ui,sans-serif;
  --font-ar:"IBM Plex Sans Arabic",Manrope,Tahoma,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
}
html.light{
  --bg:#e8edf4;--bg2:#f5f7fb;--elev:rgba(255,255,255,.72);--elev2:rgba(255,255,255,.86);
  --glass:rgba(255,255,255,.55);--glass2:rgba(255,255,255,.42);
  --line:rgba(15,22,40,.10);--line2:rgba(15,22,40,.16);
  --text:#141a26;--muted:#5d667a;--faint:#8a93a6;
  --accent:#0e7c8a;--accent2:#3b6fd6;--accent3:#9a7438;
  --glow:rgba(14,124,138,.16);--shadow:0 16px 40px rgba(20,30,50,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);overflow:hidden}
html[dir=rtl],html[dir=rtl] button,html[dir=rtl] input,html[dir=rtl] select,html[dir=rtl] textarea{font-family:var(--font-ar)}
html[dir=ltr]{font-family:var(--font)}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--accent);text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:rgba(62,200,216,.28)}
body{background:
  radial-gradient(1200px 600px at 10% -10%,rgba(62,200,216,.07),transparent 50%),
  radial-gradient(900px 500px at 110% 10%,rgba(110,168,255,.06),transparent 45%),
  var(--bg)}

/* SPLASH */
.g2{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);box-shadow:inset 0 1px 0 rgba(255,255,255,.08), var(--shadow)}
.panel,.glass,.hero,.fx-mod,.ch,.pcard,.drop-card,.sheet,.toast,.qbtn,.ai-card{background:var(--glass);backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
.knob-ui{width:62px;height:62px;border-radius:50%;background:conic-gradient(from 210deg, rgba(74,212,224,.15), rgba(255,255,255,.04) 60%, rgba(74,212,224,.2));border:1px solid var(--line);position:relative;cursor:ns-resize;touch-action:none;box-shadow:inset 0 8px 16px rgba(255,255,255,.06), 0 8px 18px rgba(0,0,0,.25)}
.knob-ui::after{content:"";position:absolute;inset:10px;border-radius:50%;background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.16), #0c121c 55%);border:1px solid var(--line)}
.knob-ui b{position:absolute;left:50%;top:8px;width:2px;height:12px;background:var(--accent);transform-origin:50% 23px;border-radius:2px;z-index:1}
.db-scale{display:flex;flex-direction:column;font-family:var(--mono);font-size:8px;color:var(--faint);line-height:1.15;margin-inline-end:4px}
.loud-flag{padding:3px 8px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:.06em;border:1px solid var(--line)}
.loud-flag.good{color:var(--ok);border-color:rgba(61,206,138,.4)}
.loud-flag.hot{color:var(--danger);border-color:rgba(226,74,91,.45)}
.loud-flag.quiet{color:var(--warn);border-color:rgba(224,176,74,.4)}
.hero-q{position:relative;overflow:hidden;padding:28px 24px 22px;border-radius:24px;margin-bottom:16px}
.hero-q::before{content:"";position:absolute;inset:0;background:
  radial-gradient(600px 220px at 90% 0%,rgba(74,212,224,.12),transparent 50%),
  linear-gradient(135deg,rgba(255,255,255,.04),transparent 40%);pointer-events:none}
.hero-q h1{font-size:clamp(22px,3.4vw,34px);font-weight:800;letter-spacing:.14em}
.brand-line{margin-top:10px;color:var(--accent3);font-size:13px;letter-spacing:.08em}
.hero4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:20px}
.hero4 .qbtn{min-height:118px;padding:18px;border-radius:18px;text-align:center}
.hero4 .qbtn em{display:block;font-style:normal;font-size:26px;margin-bottom:8px}
.mode-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:11px;border:1px solid var(--line);color:var(--muted)}
#splash{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#05070b;transition:opacity .7s ease,visibility .7s}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
.splash-mark{width:88px;height:88px;margin-bottom:22px;filter:drop-shadow(0 0 18px var(--glow))}
.splash-title{font-weight:800;letter-spacing:.18em;font-size:22px;color:#f3f7ff}
.splash-sub{margin-top:10px;color:#8ea0b8;font-size:15px}
.splash-wave{display:flex;gap:4px;height:28px;align-items:flex-end;margin-top:28px}
.splash-wave i{width:4px;background:linear-gradient(#3ec8d8,#6ea8ff);border-radius:4px;animation:eq 1s ease-in-out infinite}
.splash-wave i:nth-child(1){height:8px;animation-delay:0s}
.splash-wave i:nth-child(2){height:16px;animation-delay:.1s}
.splash-wave i:nth-child(3){height:26px;animation-delay:.18s}
.splash-wave i:nth-child(4){height:14px;animation-delay:.28s}
.splash-wave i:nth-child(5){height:22px;animation-delay:.12s}
.splash-wave i:nth-child(6){height:10px;animation-delay:.22s}
.splash-wave i:nth-child(7){height:18px;animation-delay:.08s}
@keyframes eq{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}

/* APP SHELL */
#app{height:100%;display:grid;grid-template-columns:var(--nav) 1fr var(--side);grid-template-rows:var(--top) 1fr var(--bot);opacity:0;transform:translateY(8px);transition:opacity .5s ease,transform .5s ease;position:relative;z-index:1}
.t-btn.on{border-color:rgba(62,200,216,.45);color:var(--accent);background:rgba(62,200,216,.12)}
#app.ready{opacity:1;transform:none}
#app.no-side{grid-template-columns:var(--nav) 1fr 0px}
#app.no-side #inspector{display:none}
html.light #app{background:transparent}

header{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--glass);backdrop-filter:blur(18px);z-index:20}
.brand{display:flex;align-items:center;gap:10px;min-width:210px}
.logo-svg{width:34px;height:34px}
.brand-name{display:flex;flex-direction:column;line-height:1.1}
.brand-name b{font-size:12.5px;letter-spacing:.16em;font-weight:800}
.brand-name span{font-size:10px;color:var(--muted);letter-spacing:.08em}
.proj-chip{flex:1;display:flex;align-items:center;justify-content:center}
.proj-chip input{background:var(--elev2);border:1px solid var(--line);border-radius:999px;padding:8px 16px;min-width:min(420px,46vw);text-align:center;font-weight:600;font-size:13px}
.hdr-actions{display:flex;align-items:center;gap:8px}
.seg{display:flex;background:var(--elev2);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{padding:6px 10px;border-radius:999px;font-size:12px;color:var(--muted);font-weight:600}
.seg button.on{background:linear-gradient(180deg,rgba(62,200,216,.2),rgba(62,200,216,.08));color:var(--text);box-shadow:inset 0 0 0 1px rgba(62,200,216,.28)}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--elev2);display:grid;place-items:center;color:var(--text)}
.icon-btn:hover{border-color:var(--line2)}

nav.rail{grid-row:2/4;border-inline-end:1px solid var(--line);background:var(--glass);backdrop-filter:blur(16px);display:flex;flex-direction:column;align-items:center;padding:10px 8px 12px;gap:4px;z-index:15;overflow:auto}
.nav-btn{width:54px;min-height:52px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font-size:9px;font-weight:600;letter-spacing:.02em;padding:6px 2px}
.nav-btn svg{width:18px;height:18px}
.nav-btn:hover{background:rgba(255,255,255,.04);color:var(--text)}
.nav-btn.active{background:linear-gradient(180deg,rgba(62,200,216,.16),rgba(62,200,216,.05));color:var(--accent);box-shadow:inset 0 0 0 1px rgba(62,200,216,.22)}
.rail-gap{flex:1}

#workspace{min-width:0;min-height:0;overflow:hidden;position:relative}
.view{display:none;height:100%;overflow:auto;padding:16px}
.view.on{display:block}
.view.flat{padding:0;overflow:hidden;display:none;flex-direction:column}
.view.flat.on{display:flex}

#inspector{border-inline-start:1px solid var(--line);background:var(--glass);backdrop-filter:blur(16px);min-width:0;overflow:hidden;display:flex;flex-direction:column}
.insp-head{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.insp-head h3{font-size:13px;letter-spacing:.08em}
.insp-tabs{display:flex;gap:4px;padding:8px;overflow:auto;border-bottom:1px solid var(--line)}
.insp-tabs button{padding:6px 9px;border-radius:8px;font-size:11px;color:var(--muted);font-weight:600;white-space:nowrap}
.insp-tabs button.on{background:var(--elev2);color:var(--text);border:1px solid var(--line)}
.insp-body{flex:1;overflow:auto;padding:12px}
.fx-mod{background:var(--elev);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
.fx-mod h4{font-size:12px;letter-spacing:.1em;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;color:var(--muted)}
.knob-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.knob{display:flex;flex-direction:column;align-items:center;gap:6px}
.knob canvas{width:54px;height:54px;cursor:ns-resize;touch-action:none}
.knob label{font-size:10px;color:var(--muted)}
.knob .kv{font-family:var(--mono);font-size:10px;color:var(--accent)}
.toggle{position:relative;width:36px;height:20px;border-radius:999px;background:#2a3142;border:1px solid var(--line);flex-shrink:0}
.toggle i{position:absolute;top:2px;inset-inline-start:2px;width:14px;height:14px;border-radius:50%;background:#9aa3b5;transition:.2s}
.toggle.on{background:rgba(62,200,216,.25);border-color:rgba(62,200,216,.4)}
.toggle.on i{inset-inline-start:18px;background:var(--accent)}
html[dir=rtl] .toggle.on i{inset-inline-start:auto;inset-inline-end:2px}
html[dir=rtl] .toggle i{inset-inline-start:auto;inset-inline-end:18px}
html[dir=rtl] .toggle.on i{inset-inline-end:2px}

#transport{grid-column:2/-1;border-top:1px solid var(--line);background:var(--glass);backdrop-filter:blur(18px);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:8px 14px;gap:12px;z-index:20}
.meters{display:flex;gap:10px;align-items:center;min-width:0}
.meter-col{display:flex;flex-direction:column;gap:3px}
.meter-col span{font-size:9px;color:var(--muted);font-family:var(--mono)}
.meter{width:120px;height:8px;border-radius:6px;background:#0b0e14;border:1px solid var(--line);overflow:hidden;position:relative}
html.light .meter{background:#d9dee8}
.meter > b{display:block;height:100%;width:0;background:linear-gradient(90deg,#3dce8a,#e0b04a 78%,#e24a5b 92%);border-radius:6px}
.clip{width:8px;height:8px;border-radius:50%;background:#2a3142}
.clip.on{background:var(--danger);box-shadow:0 0 8px var(--danger)}
.transport-ctrls{display:flex;align-items:center;gap:8px}
.t-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--elev2);display:grid;place-items:center}
.t-btn.play{width:48px;height:48px;border-radius:16px;background:linear-gradient(180deg,#3ec8d8,#2aa4b4);color:#041016;border:none;box-shadow:0 8px 24px var(--glow)}
.t-btn.rec{color:var(--rec)}
.t-btn.rec.on{background:var(--rec);color:#fff;box-shadow:0 0 16px rgba(226,74,91,.45)}
.time-read{font-family:var(--mono);font-size:13px;color:var(--text);min-width:168px;text-align:center}
.time-read small{color:var(--muted)}
.loud{display:flex;gap:8px;font-family:var(--mono);font-size:10px;color:var(--muted);justify-content:flex-end;flex-wrap:wrap}
.loud b{color:var(--text);font-weight:600}

/* EDITOR */
.editor-top{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);background:rgba(0,0,0,.18)}
html.light .editor-top{background:rgba(255,255,255,.5)}
.tool{width:34px;height:34px;border-radius:8px;border:1px solid transparent;display:grid;place-items:center;color:var(--muted)}
.tool:hover,.tool.on{background:var(--elev2);border-color:var(--line);color:var(--text)}
.file-meta{margin-inline-start:auto;display:flex;gap:12px;font-size:11px;color:var(--muted);font-family:var(--mono);flex-wrap:wrap}
.wave-wrap{flex:1;position:relative;min-height:0;background:linear-gradient(#0a0d14,#0e131d)}
html.light .wave-wrap{background:linear-gradient(#e8ebf2,#f4f6fa)}
#wave{width:100%;height:100%;display:block;cursor:crosshair;touch-action:none}
.wave-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.drop-card{pointer-events:auto;width:min(520px,86%);padding:28px;border:1px dashed rgba(62,200,216,.35);border-radius:18px;background:rgba(62,200,216,.05);text-align:center}
.drop-card h2{font-size:18px;margin-bottom:8px}
.drop-card p{color:var(--muted);font-size:13px}
.mini-spec{height:86px;border-top:1px solid var(--line);display:block;width:100%;background:#07090e}
html.light .mini-spec{background:#e9edf4}

/* DASHBOARD */
.hero{padding:22px;border-radius:20px;background:
  linear-gradient(135deg,rgba(62,200,216,.12),rgba(110,168,255,.06) 40%,rgba(201,168,108,.05)),
  var(--elev);border:1px solid var(--line);box-shadow:var(--shadow);margin-bottom:16px}
.hero h1{font-size:28px;font-weight:800;letter-spacing:.04em}
.hero p{color:var(--muted);margin-top:6px;max-width:640px}
.qgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.qbtn{padding:16px;border-radius:14px;background:var(--glass2);border:1px solid var(--line);text-align:start;transition:.2s}
.qbtn:hover{transform:translateY(-2px);border-color:rgba(62,200,216,.35);box-shadow:0 10px 24px rgba(0,0,0,.2)}
.qbtn b{display:block;font-size:14px}
.qbtn span{display:block;margin-top:4px;font-size:11px;color:var(--muted)}
.cards{display:grid;grid-template-columns:2fr 1fr;gap:12px}
.panel{background:var(--elev);border:1px solid var(--line);border-radius:16px;padding:16px}
.panel h3{font-size:13px;letter-spacing:.1em;color:var(--muted);margin-bottom:12px}
.stat{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.stat:last-child{border:none}
.recent{display:flex;flex-direction:column;gap:8px}
.recent button{text-align:start;padding:10px 12px;border-radius:10px;background:var(--elev2);border:1px solid var(--line)}
.recent small{color:var(--muted)}

/* RECORD / VIDEO / AI */
.studio-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:14px;height:100%}
.glass{background:var(--elev);border:1px solid var(--line);border-radius:16px;padding:16px}
.big-rec{width:96px;height:96px;border-radius:50%;margin:18px auto;display:grid;place-items:center;background:radial-gradient(circle at 40% 30%,#ff6b78,var(--rec));box-shadow:0 12px 40px rgba(226,74,91,.35);color:#fff}
.big-rec.live{animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 14px rgba(226,74,91,.15)}}
.level-big{height:14px;border-radius:8px;background:#0b0e14;border:1px solid var(--line);overflow:hidden;margin-top:10px}
.level-big b{display:block;height:100%;width:0;background:linear-gradient(90deg,#3dce8a,#e0b04a,#e24a5b)}
#recWave{width:100%;height:120px;display:block;background:#07090e;border-radius:12px;margin-top:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{padding:9px 14px;border-radius:10px;background:var(--elev2);border:1px solid var(--line);font-weight:600;font-size:13px}
.btn.primary{background:linear-gradient(180deg,#3ec8d8,#2498a8);color:#041016;border:none}
.btn.ghost{background:transparent}
.btn.danger{background:rgba(226,74,91,.15);color:#ff8a96;border-color:rgba(226,74,91,.3)}
.btn:disabled{opacity:.45;cursor:not-allowed}
select,input[type=text],input[type=number],input[type=url],input[type=password],input[type=search]{background:var(--elev2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px}
label.field{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted);flex:1}
input[type=range]{width:100%;accent-color:var(--accent)}
video#vid{width:100%;max-height:280px;background:#000;border-radius:12px}
.ai-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.ai-card{padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--elev2);text-align:start}
.ai-card b{display:block;font-size:13px}
.ai-card span{font-size:11px;color:var(--muted)}
.analysis{font-size:13px;line-height:1.7}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10px;border:1px solid var(--line);margin-inline-start:6px}
.badge.hi{color:#ff8a96;border-color:rgba(226,74,91,.4)}
.badge.mid{color:#e0b04a;border-color:rgba(224,176,74,.4)}
.badge.lo{color:#3dce8a;border-color:rgba(61,206,138,.4)}
.notice{font-size:12px;color:var(--muted);background:rgba(110,168,255,.08);border:1px solid rgba(110,168,255,.2);padding:10px 12px;border-radius:10px;margin:8px 0}

/* MIXER */
.mixer{display:flex;gap:8px;overflow:auto;padding:8px;height:100%;align-items:stretch}
.ch{width:92px;flex:0 0 92px;background:var(--elev);border:1px solid var(--line);border-radius:14px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:6px}
.ch.master{border-color:rgba(62,200,216,.35);width:110px;flex-basis:110px}
.ch h5{font-size:10px;letter-spacing:.08em;color:var(--muted)}
.fader{writing-mode:vertical-lr;direction:rtl;height:160px;width:18px;accent-color:var(--accent)}
.vu{width:8px;height:160px;background:#0b0e14;border-radius:6px;border:1px solid var(--line);position:relative;overflow:hidden}
.vu i{position:absolute;bottom:0;left:0;right:0;height:0;background:linear-gradient(#e24a5b,#e0b04a 20%,#3dce8a)}

/* PRESETS / SETTINGS / ABOUT */
.preset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.pcard{padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--elev);text-align:start}
.pcard:hover{border-color:rgba(62,200,216,.35)}
.about-hero{display:grid;grid-template-columns:140px 1fr;gap:18px;align-items:center}
.avatar{width:140px;height:140px;border-radius:28px;background:
  radial-gradient(circle at 30% 20%,rgba(62,200,216,.4),transparent 50%),
  linear-gradient(160deg,#121826,#1c2740);border:1px solid var(--line);display:grid;place-items:center}
.socials{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{padding:6px 10px;border-radius:999px;background:var(--elev2);border:1px solid var(--line);font-size:11px;display:flex;align-items:center;gap:6px;cursor:grab}
.chip.off{opacity:.4}
.eq-can{width:100%;height:150px;background:#07090e;border-radius:10px;border:1px solid var(--line);display:block}
html.light .eq-can{background:#e8ecf3}

/* MOBILE */
#mnav{display:none;position:fixed;bottom:0;left:0;right:0;height:64px;padding-bottom:env(safe-area-inset-bottom);background:var(--glass);backdrop-filter:blur(18px);border-top:1px solid var(--line);z-index:30;grid-template-columns:repeat(5,1fr)}
#mnav button{color:var(--muted);font-size:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
#mnav button.active{color:var(--accent)}
#toasts{position:fixed;top:70px;inset-inline-end:16px;z-index:80;display:flex;flex-direction:column;gap:8px}
.toast{min-width:240px;max-width:360px;padding:10px 14px;border-radius:12px;background:var(--elev);border:1px solid var(--line);box-shadow:var(--shadow);font-size:13px}
.toast.err{border-color:rgba(226,74,91,.4)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90;display:none;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.sheet{width:min(640px,96vw);max-height:86vh;overflow:auto;background:var(--elev);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
kbd{font-family:var(--mono);font-size:11px;padding:2px 6px;border-radius:6px;border:1px solid var(--line);background:var(--elev2)}
.drop-overlay{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;background:rgba(8,12,20,.72);border:3px dashed var(--accent);color:var(--accent);font-size:22px;font-weight:700}
.drop-overlay.on{display:flex}
.progress{height:6px;background:var(--elev2);border-radius:99px;overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;width:0;background:var(--accent)}
hr.sep{border:none;border-top:1px solid var(--line);margin:12px 0}

@media (max-width:1080px){
  :root{--side:300px;--nav:64px}
  .qgrid,.hero4{grid-template-columns:repeat(2,1fr)}
  .cards,.studio-grid,.about-hero{grid-template-columns:1fr}
}
@media (max-width:860px){
  #app{grid-template-columns:1fr;grid-template-rows:52px 1fr 78px 64px}
  nav.rail,#inspector{display:none !important}
  #transport{grid-column:1;padding:6px 8px;grid-template-columns:1fr;justify-items:center}
  .meters,.loud{display:none}
  #mnav{display:grid}
  .hero h1{font-size:22px}
  .qgrid{grid-template-columns:1fr 1fr}
  .proj-chip input{min-width:0;width:42vw}
  .brand-name span{display:none}
  .file-meta{display:none}
  .t-btn{width:36px;height:36px}
  .t-btn.play{width:44px;height:44px}
  #app.ready{padding-bottom:0}
  .view{padding:12px}
}

<div id="splash">
  <svg class="splash-mark" viewBox="0 0 64 64" fill="none">
    <rect x="4" y="4" width="56" height="56" rx="16" stroke="#3ec8d8" stroke-width="1.5" fill="#0b111a"/>
    <path d="M14 34c4-12 8 12 12 0s8 12 12 0 8 12 12 0" stroke="#3ec8d8" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <circle cx="32" cy="18" r="2.2" fill="#c9a86c"/>

</div>

<div class="drop-overlay" id="dropOverlay">دەنگەکەت لێرە دابنێ</div>
<div id="toasts"></div>

<div class="modal" id="modal">
  <div class="sheet" id="modalBody"></div>
</div>

<div id="app">
  <header>
    <div class="brand">
      <svg class="logo-svg" viewBox="0 0 64 64" fill="none">
        <rect x="4" y="4" width="56" height="56" rx="16" stroke="currentColor" stroke-opacity=".25" stroke-width="1.5" fill="url(#g)"/>
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#132033"/><stop offset="1" stop-color="#0c141f"/></linearGradient></defs>
        <path d="M14 34c4-12 8 12 12 0s8 12 12 0 8 12 12 0" stroke="#3ec8d8" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      </svg>
      <div class="brand-name"><b>ONE STUDIO MASTER</b><span data-i18n="tagline">AUDIO ENGINEERING</span></div>
    </div>
    <div class="proj-chip"><input id="projName" value="Untitled Project" maxlength="80" aria-label="Project name"/></div>
    <div class="hdr-actions">
      <button class="icon-btn" id="btnUndo" title="Undo">↺</button>
      <button class="icon-btn" id="btnRedo" title="Redo">↻</button>
      <button class="icon-btn" id="btnSave" title="Save">💾</button>
      <button class="icon-btn" id="btnExportH" title="Export">⇧</button>
      <div class="seg" id="langSeg" role="group" aria-label="Language">
        <button data-lang="ckb" class="on">کوردی</button>
        <button data-lang="ar">العربية</button>
        <button data-lang="en">English</button>
      </div>
      <button class="icon-btn" id="themeBtn" title="Theme" aria-label="Theme">◐</button>
      <button class="icon-btn" id="helpBtn" title="Shortcuts">?</button>
    </div>
  </header>

  <nav class="rail" id="rail"></nav>

  <main id="workspace">
    <section class="view on" id="view-dashboard"></section>
    <section class="view flat" id="view-editor">
      <div class="editor-top" id="editorTools"></div>
      <div class="wave-wrap">
        <canvas id="wave"></canvas>
        <div class="wave-empty" id="waveEmpty">
          <div class="drop-card">
            <h2 data-i18n="dropTitle">دەنگەکەت لێرە دابنێ</h2>
            <p data-i18n="dropSub">کلیکی بکە بۆ زیادکردنی فایل · MP3 WAV M4A AAC OGG FLAC</p>
            <div class="row" style="justify-content:center;margin-top:12px">
              <button class="btn primary" id="btnImport">Import</button>
              <button class="btn" id="btnImportVid">Video</button>
            </div>
          </div>
        </div>
      </div>
      <canvas class="mini-spec" id="spec"></canvas>
    </section>
    <section class="view" id="view-record"></section>
    <section class="view" id="view-video"></section>
    <section class="view" id="view-ailab"></section>
    <section class="view" id="view-plugins"></section>
    <section class="view" id="view-presets"></section>
    <section class="view" id="view-mixer"></section>
    <section class="view" id="view-export"></section>
    <section class="view" id="view-settings"></section>
    <section class="view" id="view-about"></section>
    <section class="view" id="view-spectrum"></section>
    <section class="view" id="view-quran"></section>
  </main>

  <aside id="inspector">
    <div class="insp-head">
      <h3 data-i18n="inspector">EFFECTS RACK</h3>
      <div class="row">
        <button class="btn" id="bypassAll" data-i18n="bypassAll">Bypass All</button>
        <button class="btn" id="resetFx" data-i18n="resetFx">Reset</button>
      </div>
    </div>
    <div class="insp-tabs" id="inspTabs"></div>
    <div class="insp-body" id="inspBody"></div>
  </aside>

  <footer id="transport">
    <div class="meters">
      <div class="meter-col"><span>IN</span><div class="meter"><b id="mIn"></b></div></div>
      <div class="meter-col"><span>OUT</span><div class="meter"><b id="mOut"></b></div></div>
      <div class="meter-col"><span>GR</span><div class="meter"><b id="mGr" style="background:#6ea8ff"></b></div></div>
      <div class="clip" id="clipLed"></div>
    </div>
    <div class="transport-ctrls">
      <button class="t-btn" id="btnStop" title="Stop">■</button>
      <button class="t-btn play" id="btnPlay" title="Play">▶</button>
      <button class="t-btn rec" id="btnRec" title="Record">●</button>
      <button class="t-btn" id="btnLoop" title="Loop">∞</button>
      <button class="t-btn" id="btnAB" title="Compare A/B">A/B</button>
      <div class="time-read"><span id="tCur">00:00.00</span> <small>/</small> <span id="tDur">00:00.00</span></div>
    </div>
    <div class="loud">
      <div>PEAK <b id="vPeak">-∞</b></div>
      <div>RMS <b id="vRms">-∞</b></div>
      <div>M <b id="vM">-∞</b></div>
      <div>S <b id="vS">-∞</b></div>
      <div>I <b id="vI">-∞</b></div>
    </div>
  </footer>
</div>

/* ---------- FFT (radix-2) ---------- */
function fft(re, im){
  const n=re.length;
  for(let i=1,j=0;i<n;i++){
    let bit=n>>1;
    for(;j&bit;bit>>=1)j^=bit;
    j^=bit;
    if(i<j){[re[i],re[j]]=[re[j],re[i]];[im[i],im[j]]=[im[j],im[i]]}
  }
  for(let len=2;len<=n;len<<=1){
    const ang=-2*Math.PI/len, wnr=Math.cos(ang), wni=Math.sin(ang);
    for(let i=0;i<n;i+=len){
      let wr=1, wi=0;
      for(let j=0;j<len/2;j++){
        const u=i+j, v=u+len/2;
        const tr=wr*re[v]-wi*im[v], ti=wr*im[v]+wi*re[v];
        re[v]=re[u]-tr; im[v]=im[u]-ti; re[u]+=tr; im[u]+=ti;
        const nwr=wr*wnr-wi*wni; wi=wr*wni+wi*wnr; wr=nwr;
      }
    }
  }
}
function ifft(re,im){
  for(let i=0;i<im.length;i++) im[i]=-im[i];
  fft(re,im);
  const n=re.length;
  for(let i=0;i<n;i++){re[i]/=n; im[i]=-im[i]/n}
}

const IDB = {
  db:null,
  open(){
    return new Promise((res,rej)=>{
      const r=indexedDB.open("one-studio-master",1);
      r.onupgradeneeded=()=>{
        const db=r.result;
        if(!db.objectStoreNames.contains("projects")) db.createObjectStore("projects");
        if(!db.objectStoreNames.contains("blobs")) db.createObjectStore("blobs");
      };
      r.onsuccess=()=>{this.db=r.result;res(this.db)};
      r.onerror=()=>rej(r.error);
    });
  },
  put(store,key,val){
    return new Promise((res,rej)=>{
      const tx=this.db.transaction(store,"readwrite");
      tx.objectStore(store).put(val,key);
      tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error);
    });
  },
  get(store,key){
    return new Promise((res,rej)=>{
      const tx=this.db.transaction(store,"readonly");
      const q=tx.objectStore(store).get(key);
      q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error);
    });
  },
  keys(store){
    return new Promise((res,rej)=>{
      const tx=this.db.transaction(store,"readonly");
      const q=tx.objectStore(store).getAllKeys();
      q.onsuccess=()=>res(q.result||[]); q.onerror=()=>rej(q.error);
    });
  }
};

    for(let i=Math.max(0,p0); i+N<Math.min(x.length,p1||p0+sr*0.5); i+=hop){
      const re=new Float32Array(N), im=new Float32Array(N);
      for(let k=0;k<N;k++) re[k]=x[i+k]*win[k];
      fft(re,im);
      for(let k=0;k<N/2;k++) noise[k]+=Math.hypot(re[k],im[k]);
      frames++;
    }
    if(frames) for(let k=0;k<noise.length;k++) noise[k]/=frames;
    else {
      for(let k=0;k<noise.length;k++) noise[k]=0.0001;
    }
    const y=new Float32Array(x.length);
    const ola=new Float32Array(x.length);
    for(let i=0;i+N<x.length;i+=hop){
      const re=new Float32Array(N), im=new Float32Array(N);
      for(let k=0;k<N;k++) re[k]=x[i+k]*win[k];
      fft(re,im);
      for(let k=0;k<N/2;k++){
        const mag=Math.hypot(re[k],im[k]);
        const ang=Math.atan2(im[k],re[k]);
        let g=(mag-noise[k]*amount*1.6)/(mag+1e-12);
        const floor=0.04+(S.fx.nr.voice||0.5)*0.22;
        const det=S.fx.nr.detail||0.6;
        if(k>N*0.28) g=g*(0.55+0.45*det)+ (1-(0.55+0.45*det));
        g=Math.max(floor, Math.min(1,g));
        const m=mag*g;
        re[k]=m*Math.cos(ang); im[k]=m*Math.sin(ang);
        if(k>0){ re[N-k]=re[k]; im[N-k]=-im[k]; }
      }
      ifft(re,im);
      for(let k=0;k<N;k++){ y[i+k]+=re[k]*win[k]; ola[i+k]+=win[k]*win[k]; }
    }
    for(let i=0;i<y.length;i++) y[i]/=(ola[i]||1);
    outCh.push(y);
  }
  return bufFrom(outCh,sr);
}
function hann(n){ const w=new Float32Array(n); for(let i=0;i<n;i++) w[i]=0.5-0.5*Math.cos(2*Math.PI*i/n); return w; }

/* ---------- Waveform ---------- */
const Waveform = {
  peaks:null, w:0, h:0,
  rebuild(){
    const buf=AudioEngine.buffer; if(!buf) return;
    const ch0=buf.getChannelData(0);
    const blocks=Math.min(20000, ch0.length);
    const spb=Math.max(1, Math.floor(ch0.length/blocks));
    const pk=new Float32Array(blocks*2);
    for(let i=0;i<blocks;i++){
      let mn=1, mx=-1;
      const s=i*spb, e=Math.min(ch0.length,s+spb);
      for(let j=s;j<e;j++){ const v=ch0[j]; if(v<mn)mn=v; if(v>mx)mx=v; }
      pk[i*2]=mn; pk[i*2+1]=mx;
    }
    this.peaks=pk; this.draw();
  },
  draw(){
    const c=$("wave"); if(!c) return;
    const dpr=window.devicePixelRatio||1;
    const r=c.parentElement.getBoundingClientRect();
    c.width=Math.max(1,r.width*dpr); c.height=Math.max(1,r.height*dpr);
    c.style.width=r.width+"px"; c.style.height=r.height+"px";
    const g=c.getContext("2d");
    const W=c.width, H=c.height;
    g.clearRect(0,0,W,H);
    const dark=!document.documentElement.classList.contains("light");
    g.fillStyle=dark?"#0a0d14":"#e8ebf2"; g.fillRect(0,0,W,H);
    // grid
    g.strokeStyle=dark?"rgba(255,255,255,.04)":"rgba(0,0,0,.06)";
    g.lineWidth=1;
    for(let i=1;i<8;i++){ g.beginPath(); g.moveTo(0,H*i/8); g.lineTo(W,H*i/8); g.stroke(); }
    if(!this.peaks||!AudioEngine.buffer) return;
    const dur=AudioEngine.buffer.duration;
    const view=dur/S.zoom;
    const start=clamp(S.scroll,0,Math.max(0,dur-view));
    S.scroll=start;
    const mid=H/2;
    const pk=this.peaks, n=pk.length/2;
    g.beginPath();
    g.strokeStyle=dark?"rgba(62,200,216,.85)":"rgba(18,138,154,.9)";
    g.lineWidth=Math.max(1,dpr);
    const x0=start/dur*n, x1=(start+view)/dur*n;
    for(let x=0;x<W;x++){
      const t=x0+(x1-x0)*x/W;
      const i=clamp(Math.floor(t),0,n-1);
      const mn=pk[i*2], mx=pk[i*2+1];
      g.moveTo(x, mid-mx*mid*0.92);
      g.lineTo(x, mid-mn*mid*0.92);
    }
    g.stroke();
    if(S.hasSel){
      const a=(Math.min(S.selA,S.selB)-start)/view*W;
      const b=(Math.max(S.selA,S.selB)-start)/view*W;
      g.fillStyle="rgba(110,168,255,.18)";
      g.fillRect(a,0,b-a,H);
    }
    const ph=AudioEngine.now();
    S.playhead=ph;
    const px=(ph-start)/view*W;
    g.strokeStyle="#c9a86c"; g.lineWidth=2*dpr;
    g.beginPath(); g.moveTo(px,0); g.lineTo(px,H); g.stroke();
    $("tCur").textContent=fmtTime(ph);
    $("tDur").textContent=fmtTime(dur);
  },
  xToTime(x){
    if(!AudioEngine.buffer) return 0;
    const r=$("wave").getBoundingClientRect();
    const dur=AudioEngine.buffer.duration, view=dur/S.zoom;
    return clamp(S.scroll + (x-r.left)/r.width*view, 0, dur);
  }
};

async function importFile(file){

    const ab=await file.arrayBuffer();

/* ---------- Recorder ---------- */
const Rec = {
  stream:null, proc:null, src:null, gain:null, chunks:null, ana:null, paused:false, t0:0, acc:0, timer:null, live:[],
  async devices(){
    try{
      const d=await navigator.mediaDevices.enumerateDevices();
      return d.filter(x=>x.kind==="audioinput");
    }catch(e){ return []; }
  },
  async perm(id){
    try{
      const c={audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false,deviceId:id?{exact:id}:undefined}};
      this.stream=await navigator.mediaDevices.getUserMedia(c);
      return true;
    }catch(e){ toast(t("micDenied"),true); return false; }
  },
  async start(){
    await AudioEngine.ensure();
    if(!this.stream){ const ok=await this.perm($("micSel")&&$("micSel").value); if(!ok) return; }
    this.chunks=[[],[]]; this.live=[]; this.paused=false; this.acc=0; this.t0=performance.now();
    this.src=AudioEngine.ctx.createMediaStreamSource(this.stream);
    this.gain=AudioEngine.ctx.createGain();
    this.gain.gain.value=Math.pow(10, (parseFloat($("inGain")?.value||0))/20);
    this.ana=AudioEngine.ctx.createAnalyser(); this.ana.fftSize=1024;
    try{
      this.proc=new AudioWorkletNode(AudioEngine.ctx,"rec-proc");
      this.proc.port.onmessage=(ev)=>{
        if(this.paused) return;
        const chs=ev.data;
        for(let c=0;c<chs.length;c++){
          if(!this.chunks[c]) this.chunks[c]=[];
          this.chunks[c].push(chs[c]);
        }
        const a=chs[0];
        this.live.push(a);
        if(this.live.length>40) this.live.shift();
      };
    }catch(e){
      this.proc=AudioEngine.ctx.createScriptProcessor(2048,2,2);
      this.proc.onaudioprocess=(ev)=>{
        if(this.paused) return;
        for(let c=0;c<ev.inputBuffer.numberOfChannels;c++){
          if(!this.chunks[c]) this.chunks[c]=[];
          this.chunks[c].push(new Float32Array(ev.inputBuffer.getChannelData(c)));
        }
      };
    }
    this.src.connect(this.gain); this.gain.connect(this.ana); this.ana.connect(this.proc);
    try{ this.proc.connect(AudioEngine.ctx.createGain()); }catch(e){}
    S.recState="live";
    this.timer=setInterval(()=>UI.recClock(),100);
    UI.renderRecord();
  },
  pause(){ this.paused=true; this.acc+=performance.now()-this.t0; S.recState="paused"; UI.renderRecord(); },
  resume(){ this.paused=false; this.t0=performance.now(); S.recState="live"; UI.renderRecord(); },
  stop(){
    this.paused=true; S.recState="idle";
    if(this.timer) clearInterval(this.timer);
    try{ this.proc.disconnect(); this.src.disconnect(); this.gain.disconnect(); }catch(e){}
    const sr=AudioEngine.ctx.sampleRate;
    const chs=this.chunks.filter(x=>x&&x.length).map(parts=>{
      let n=0; parts.forEach(p=>n+=p.length);
      const o=new Float32Array(n); let off=0;
      parts.forEach(p=>{o.set(p,off); off+=p.length});
      return o;
    });
    if(!chs.length||!chs[0].length){ toast(t("noAudio"),true); UI.renderRecord(); return null; }
    const buf=bufFrom(chs,sr);
    return buf;
  },
  elapsed(){
    const extra=S.recState==="live"? performance.now()-this.t0 : 0;
    return (this.acc+extra)/1000;
  }
};

/* ---------- Analysis / AI layer ---------- */
const AIEngine = {
  getCfg(){
    return { url: localStorage.getItem("osm_ai_url")||"", key: localStorage.getItem("osm_ai_key")||"" };
  },
  analyze(buf){
    const ch=buf.getChannelData(0);
    const sr=buf.sampleRate;
    const hop=2048;
    let peak=0, sum2=0, clip=0;
    const winE=[];
    for(let i=0;i<ch.length;i++){
      const v=ch[i]; peak=Math.max(peak,Math.abs(v)); sum2+=v*v;
      if(Math.abs(v)>0.99) clip++;
    }
    for(let i=0;i+hop<ch.length;i+=hop){
      let e=0; for(let j=0;j<hop;j++) e+=ch[i+j]*ch[i+j];
      winE.push(Math.sqrt(e/hop));
    }
    winE.sort((a,b)=>a-b);
    const noise=winE[Math.floor(winE.length*0.08)]||0;
    const rms=Math.sqrt(sum2/ch.length);
    const crest=rms>0? peak/rms : 0;
    // spectral
    const N=2048, re=new Float32Array(N), im=new Float32Array(N);
    const mid=Math.floor(ch.length/2);
    const w=hann(N);
    for(let i=0;i<N;i++) re[i]=(ch[mid+i]||0)*w[i];
    fft(re,im);
    let low=0, midb=0, hi=0, tot=0, csum=0, cden=0;
    for(let k=1;k<N/2;k++){
      const mag=Math.hypot(re[k],im[k]); const f=k*sr/N;
      tot+=mag; csum+=f*mag; cden+=mag;
      if(f<80) low+=mag; else if(f<8000) midb+=mag; else hi+=mag;
    }
    const centroid=cden? csum/cden : 0;
    const rumble=tot? low/tot : 0;
    const hiss=tot? hi/tot : 0;
    const noiseLvl = noise<0.004?"low":noise<0.015?"medium":"high";
    const clarity = centroid>2800?"high":centroid>1400?"medium":"low";
    const rumbleLvl = rumble>0.18?"high":rumble>0.08?"medium":"low";
    const dyn = crest>8?"high":crest>4?"medium":"low";
    const suggest=[];
    if(noiseLvl!=="low") suggest.push("Noise Reduction");
    if(rumbleLvl!=="low") suggest.push("High Pass");
    if(hiss>0.12) suggest.push("De-Esser / Low Pass");
    if(dyn==="high") suggest.push("Compression");
    if(peak>0.95) suggest.push("Limiter");
    if(clarity==="low") suggest.push("Presence EQ");
    suggest.push("LUFS check");
    const rec={
      nr: noiseLvl==="high"?38:noiseLvl==="medium"?28:12,
      hpf: rumbleLvl==="high"?95:rumbleLvl==="medium"?75:55,
      comp: dyn==="high"?"Gentle": dyn==="medium"?"Light":"Off",
      deess: hiss>0.14?"Moderate": hiss>0.08?"Light":"Off",
      reverb: "Natural Hall",
      limit: peak>0.9?-1:-1.5
    };
    return {peak,rms,clip,noise,noiseLvl,clarity,rumbleLvl,dyn,centroid,hiss,suggest,crest,rec};
  },
  applyRecommendation(a){
    if(!a||!a.rec) return;
    FxHistory.push();
    const r=a.rec;
    S.fx.nr.on=true; S.fx.nr.amount=r.nr/100; S.fx.nr.hpf=r.hpf;
    S.fx.eq.on=true; S.fx.eq.bands[0].on=true; S.fx.eq.bands[0].f=r.hpf;
    S.fx.deess.on = r.deess!=="Off"; S.fx.deess.amt = r.deess==="Moderate"?.45:.28;
    S.fx.comp.on = r.comp!=="Off"; S.fx.comp.ratio = 2.4; S.fx.comp.thr=-20;
    S.fx.reverb.on=true; S.fx.reverb.type="hall"; S.fx.reverb.mix=.1;
    S.fx.limit.on=true; S.fx.limit.thr=r.limit;
    if(AudioEngine.nodes) AudioEngine._wire();
    UI.renderInspector();
    toast(t("applied"));
  },
  async applyFix(kind){
    if(!AudioEngine.buffer){ toast(t("noAudio"),true); return; }
    const cfg=this.getCfg();
    if(cfg.url){
      toast(t("connecting"));
      try{
        const wav=encodeWav(AudioEngine.buffer,16);
        const blob=new Blob([wav],{type:"audio/wav"});
        const fd=new FormData(); fd.append("file",blob, S.fileName||"audio.wav"); fd.append("task",kind||"enhance");
        const headers={}; if(cfg.key) headers.Authorization="Bearer "+cfg.key;
        const r=await fetch(cfg.url,{method:"POST", headers, body:fd});
        if(!r.ok) throw new Error("api");
        const ab=await r.arrayBuffer();
        await AudioEngine.loadArrayBuffer(ab, (S.fileName||"ai")+"-enhanced");
        toast(t("applied"));
        return;
      }catch(e){ toast(t("fallbackDsp")); }
    } else toast(t("fallbackDsp"));
    // DSP fallback
    AudioEngine.snapshot();
    let buf=cloneBuf(AudioEngine.buffer);
    const a=this.analyze(buf);
    if(kind==="denoise"||kind==="fix"||a.noiseLvl!=="low"){
      buf=spectralNR(buf, S.fx.nr.amount||0.5, 0, Math.min(0.6, buf.duration*0.05));
    }
    AudioEngine.buffer=buf;
    S.duration=buf.duration;
    // apply voice chain
    applyNamedPreset(kind==="master"?"quranStudio": kind==="denoise"?"noiseRescue":"voiceClean");
    Waveform.rebuild();
    toast(t("applied")+" · DSP");
  }
};

/* ---------- Export / WAV ---------- */
function encodeWav(buf, bitDepth){
  const nCh=buf.numberOfChannels, sr=buf.sampleRate, len=buf.length;
  const bd=bitDepth||16;
  const isF=bd===32;
  const bps=isF?4:(bd===24?3:2);
  const dataSize=len*nCh*bps;
  const ab=new ArrayBuffer(44+dataSize);
  const v=new DataView(ab);
  const wstr=(o,s)=>{ for(let i=0;i<s.length;i++) v.setUint8(o+i,s.charCodeAt(i)); };
  wstr(0,"RIFF"); v.setUint32(4,36+dataSize,true); wstr(8,"WAVE"); wstr(12,"fmt ");
  v.setUint32(16,16,true);
  v.setUint16(20,isF?3:1,true);
  v.setUint16(22,nCh,true);
  v.setUint32(24,sr,true);
  v.setUint32(28,sr*nCh*bps,true);
  v.setUint16(32,nCh*bps,true);
  v.setUint16(34,bd,true);
  wstr(36,"data"); v.setUint32(40,dataSize,true);
  const chs=[...Array(nCh)].map((_,c)=>buf.getChannelData(c));
  let o=44;
  for(let i=0;i<len;i++){
    for(let c=0;c<nCh;c++){
      let s=Math.max(-1,Math.min(1,chs[c][i]));
      if(isF){ v.setFloat32(o,s,true); o+=4; }
      else if(bd===24){ const x=Math.round(s*8388607); v.setUint8(o,x&255); v.setUint8(o+1,(x>>8)&255); v.setUint8(o+2,(x>>16)&255); o+=3; }
      else { v.setInt16(o, Math.round(s*32767), true); o+=2; }
    }
  }
  return ab;
}

async function renderOffline(targetSr){
  if(!AudioEngine.buffer) throw new Error("no");
  await AudioEngine.ensure();
  const srcBuf=AudioEngine.buffer;
  const sr=targetSr||srcBuf.sampleRate;
  const frames=Math.ceil(srcBuf.duration*sr);
  const ch=srcBuf.numberOfChannels;
  const off=new OfflineAudioContext(ch, frames, sr);
  // rebuild a simplified chain in offline ctx
  const input=off.createBufferSource(); input.buffer=srcBuf;
  let head=input;
  const f=S.fx, bp=S.bypassAll;
  function bq(type,freq,q,g){
    const n=off.createBiquadFilter(); n.type=type; n.frequency.value=freq; n.Q.value=q; if(g!=null) n.gain.value=g;
    head.connect(n); head=n;
  }
  if(!bp && f.nr.on) bq("highpass", f.nr.hpf, .7);
  if(!bp && f.hum.on){ for(let i=1;i<=f.hum.harmonics;i++) bq("notch", f.hum.freq*i, 12); }
  if(!bp && f.eq.on){
    f.eq.bands.forEach(b=>{
      if(!b.on) return;
      const tp=b.t==="highpass"?"highpass":b.t==="lowpass"?"lowpass":b.t==="lowshelf"?"lowshelf":b.t==="highshelf"?"highshelf":b.t==="notch"?"notch":"peaking";
      bq(tp,b.f,b.q,b.g);
    });
  }
  if(!bp && f.deess.on) bq("peaking", f.deess.f, 2, -f.deess.amt*12);
  if(!bp && f.comp.on){
    const c=off.createDynamicsCompressor();
    c.threshold.value=f.comp.thr; c.ratio.value=f.comp.ratio; c.attack.value=f.comp.atk; c.release.value=f.comp.rel; c.knee.value=f.comp.knee;
    head.connect(c); head=c;
    const mk=off.createGain(); mk.gain.value=Math.pow(10,f.comp.makeup/20); head.connect(mk); head=mk;
  }
  if(!bp && f.sat.on){
    const sh=off.createWaveShaper(); sh.curve=AudioEngine._curve(f.sat.type,f.sat.drive);
    const dry=off.createGain(); dry.gain.value=1-f.sat.mix;
    const wet=off.createGain(); wet.gain.value=f.sat.mix;
    const sum=off.createGain();
    head.connect(dry); head.connect(sh); sh.connect(wet); dry.connect(sum); wet.connect(sum); head=sum;
  }
  if(!bp && f.reverb.on){
    const conv=off.createConvolver();
    // generate IR in offline
    const type=f.reverb.type; const sr2=sr;
    const map={room:[.4,.5,.3],hall:[1.8,.7,.55],studio:[.55,.4,.25],plate:[.9,.85,.2],cathedral:[3.2,.8,.7],amb:[.28,.35,.5]};
    const [decay,damp,size]=map[type]||map.studio;
    const len=Math.max(1,Math.floor(sr2*(.25+decay*1.6)));
    const ir=off.createBuffer(2,len,sr2);
    for(let c=0;c<2;c++){
      const d=ir.getChannelData(c); let lp=0;
      for(let i=0;i<len;i++){
        const tt=i/len; const env=Math.pow(1-tt,1.4+size)*Math.exp(-tt*3.2/Math.max(.2,decay));
        const nn=Math.random()*2-1; lp=lp*damp+nn*(1-damp); d[i]=(nn*(1-damp*.7)+lp)*env*.85;
      }
    }
    conv.buffer=ir;
    const dry=off.createGain(); dry.gain.value=1-f.reverb.mix;
    const wet=off.createGain(); wet.gain.value=f.reverb.mix;
    const pre=off.createDelay(1); pre.delayTime.value=f.reverb.pre;
    const sum=off.createGain();
    head.connect(dry); head.connect(pre); pre.connect(conv); conv.connect(wet); dry.connect(sum); wet.connect(sum); head=sum;
  }
  if(!bp && f.delay.on){
    const d=off.createDelay(2); d.delayTime.value=f.delay.time;
    const fb=off.createGain(); fb.gain.value=f.delay.fb;
    const wet=off.createGain(); wet.gain.value=f.delay.mix;
    const dry=off.createGain(); dry.gain.value=1-f.delay.mix;
    const hp=off.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=f.delay.lc;
    const lp=off.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=f.delay.hc;
    const sum=off.createGain();
    head.connect(dry); head.connect(hp); hp.connect(lp); lp.connect(d); d.connect(fb); fb.connect(d); d.connect(wet); dry.connect(sum); wet.connect(sum); head=sum;
  }
  if(!bp && f.limit.on){
    const lim=off.createDynamicsCompressor(); lim.threshold.value=f.limit.thr; lim.ratio.value=20; lim.attack.value=.003; lim.release.value=f.limit.rel; lim.knee.value=0;
    head.connect(lim); head=lim;
  }
  const mast=off.createGain(); mast.gain.value=S.mixer.master.mute?0:S.mixer.master.vol;
  head.connect(mast); mast.connect(off.destination);
  input.start(0);
  return off.startRendering();
}

function download(ab, name, type){
  const blob=new Blob([ab],{type:type||"application/octet-stream"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}

async function exportAudio(){
  if(!AudioEngine.buffer){ toast(t("noAudio"),true); return; }
  toast(t("rendering"));
  try{
    const fmt=$("exFmt")?.value||"wav";
    const bits=parseInt($("exBit")?.value||"24",10);
    const sr=parseInt($("exSr")?.value||"48000",10);
    let buf=await renderOffline(sr);
    if(S.fx.nr.on && S.fx.nr.amount>0.05){
      buf=spectralNR(buf, S.fx.nr.amount, 0, Math.min(.5, buf.duration*.04));
    }
    const base=(S.fileName||"one-studio").replace(/\.[^.]+$/,"")+"-master";
    if(fmt==="wav"){
      download(encodeWav(buf,bits), base+".wav", "audio/wav");
      toast(t("done")); return;
    }
    const ctx=new AudioContext();
    const dest=ctx.createMediaStreamDestination();
    const src=ctx.createBufferSource(); src.buffer=buf; src.connect(dest); src.connect(ctx.destination);
    const mime = fmt==="mp3"
      ? (MediaRecorder.isTypeSupported("audio/mpeg")?"audio/mpeg": MediaRecorder.isTypeSupported("audio/mp4")?"audio/mp4":"")
      : (MediaRecorder.isTypeSupported("audio/ogg;codecs=opus")?"audio/ogg;codecs=opus": MediaRecorder.isTypeSupported("audio/webm;codecs=opus")?"audio/webm;codecs=opus":"");
    if(!mime){ download(encodeWav(buf,24), base+".wav","audio/wav"); toast("WAV · "+t("fallbackDsp")); ctx.close(); return; }
    const rec=new MediaRecorder(dest.stream,{mimeType:mime});
    const chunks=[]; rec.ondataavailable=e=>chunks.push(e.data);
    rec.onstop=()=>{ download(new Blob(chunks,{type:mime}), base+(mime.includes("mpeg")?".mp3":mime.includes("ogg")?".ogg":".webm"), mime); toast(t("done")); ctx.close(); };
    rec.start(); src.start(); setTimeout(()=>rec.stop(), buf.duration*1000+80);
  }catch(e){ console.error(e); toast(t("exportFail"),true); }
}

async function exportVideo(){
  if(!AudioEngine.videoEl || !AudioEngine.videoFile){ toast(t("noAudio"),true); return; }
  toast(t("rendering"));
  try{
    const buf=await renderOffline(48000);
    const v=ensureVideoEl();
    const res=$("exRes")?.value||"orig";
    await new Promise(r=>{ if(v.readyState>=2) r(); else v.onloadeddata=()=>r(); });
    const canvas=document.createElement("canvas");
    const vw=v.videoWidth||1920, vh=v.videoHeight||1080;
    let w=vw,h=vh;
    if(res==="1080"){ const s=Math.min(1, 1080/vh); w=Math.round(vw*s/2)*2; h=Math.round(vh*s/2)*2; }
    if(res==="720"){ const s=Math.min(1, 720/vh); w=Math.round(vw*s/2)*2; h=Math.round(vh*s/2)*2; }
    canvas.width=w; canvas.height=h;
    const ctx2=canvas.getContext("2d");
    const vstream=canvas.captureStream(30);
    const actx=new AudioContext({sampleRate:buf.sampleRate});
    const dest=actx.createMediaStreamDestination();
    const src=actx.createBufferSource(); src.buffer=buf; src.connect(dest);
    const mixed=new MediaStream([ ...vstream.getVideoTracks(), ...dest.stream.getAudioTracks() ]);
    const mime= MediaRecorder.isTypeSupported("video/webm;codecs=vp9,opus")?"video/webm;codecs=vp9,opus":
                MediaRecorder.isTypeSupported("video/webm;codecs=vp8,opus")?"video/webm;codecs=vp8,opus":"video/webm";
    const rec=new MediaRecorder(mixed,{mimeType:mime, videoBitsPerSecond: res==="720"?5000000:8000000});
    const chunks=[]; rec.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
    rec.onstop=()=>{
      download(new Blob(chunks,{type:"video/webm"}), (S.fileName||"video").replace(/\.[^.]+$/,"")+"-osm.webm","video/webm");
      toast(t("done")); actx.close();
    };
    v.currentTime=0; v.pause();
    rec.start(200); src.start();
    const t0=performance.now();
    const draw=()=>{
      const elapsed=(performance.now()-t0)/1000;
      if(elapsed>=buf.duration){ rec.stop(); return; }
      try{ v.currentTime=elapsed; }catch(e){}
      ctx2.drawImage(v,0,0,w,h);
      requestAnimationFrame(draw);
    };
    requestAnimationFrame(draw);
  }catch(e){ console.error(e); toast(t("exportFail"),true); }
}

function rememberRecent(name,dur){
  const r=JSON.parse(localStorage.getItem("osm_recent")||"[]");
  r.unshift({name, dur, t:Date.now(), project:S.projectName});
  localStorage.setItem("osm_recent", JSON.stringify(r.slice(0,12)));
}
async function saveProject(){
  await IDB.open();
  const meta={ name:S.projectName, fileName:S.fileName, fx:S.fx, mixer:S.mixer, chain:S.chain, lang:S.lang, t:Date.now(), duration:S.duration, sr:S.sampleRate };
  await IDB.put("projects", S.projectName, meta);
  if(AudioEngine.buffer){
    const wav=encodeWav(AudioEngine.buffer,16);
    await IDB.put("blobs", S.projectName, wav);
  }
  rememberRecent(S.fileName||S.projectName, S.duration);
  toast(t("saved"));
}
async function loadProject(name){
  await IDB.open();
  const meta=await IDB.get("projects", name);
  if(!meta) return;
  S.projectName=meta.name; S.fx=deepMerge(defaultFx(), meta.fx||{}); S.mixer=meta.mixer||S.mixer; S.chain=meta.chain||S.chain;
  $("projName").value=S.projectName;
  const wav=await IDB.get("blobs", name);
  if(wav) await AudioEngine.loadArrayBuffer(wav, meta.fileName||name);
  AudioEngine._wire();
  toast(t("loaded")); showView("editor");
}

  renderInspector(){
    const tabs=["chain","eq","nr","hum","gate","deess","comp","sat","reverb","delay","limit"];
    $("inspTabs").innerHTML=tabs.map(x=>`<button class="${S.fxTab===x?"on":""}" data-tab="${x}">${x.toUpperCase()}</button>`).join("");
    $("inspTabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{S.fxTab=b.dataset.tab; this.renderInspector();});
    const box=$("inspBody");
    const f=S.fx;
    const onToggle=(path)=>`<span class="toggle ${path.on?"on":""}" data-en="1"><i></i></span>`;
    if(S.fxTab==="chain"){
      box.innerHTML=`<div class="fx-mod"><h4>${t("chain")} <button class="btn" id="cmp">${t("compare")}</button></h4>
        <p class="notice">${t("quranHint")}</p>
        <button class="btn primary" id="aq">${t("applyQuran")}</button>

      </div>`;
      $("aq").onclick=()=>applyNamedPreset("quranClean");
      $("cmp").onclick=()=>{ S.compare=!S.compare; AudioEngine._wire(); this.playBtn(); };
      return;
    }
    if(S.fxTab==="eq"){
      box.innerHTML=`<div class="fx-mod"><h4>EQ ${onToggle(f.eq)}</h4>
        <canvas class="eq-can" id="eqCan"></canvas>
        ${f.eq.bands.map((b,i)=>`<div style="margin-top:8px">
          <div class="row"><b style="font-size:11px">${b.t.toUpperCase()}</b>
            <span class="toggle ${b.on?"on":""}" data-band="${i}"><i></i></span></div>
          <label>F ${b.f.toFixed(0)} Hz<input type="range" data-eq="${i}" data-k="f" min="20" max="20000" value="${b.f}"></label>
          <label>G ${b.g.toFixed(1)} dB<input type="range" data-eq="${i}" data-k="g" min="-18" max="18" step="0.1" value="${b.g}"></label>
          <label>Q ${b.q.toFixed(2)}<input type="range" data-eq="${i}" data-k="q" min="0.3" max="12" step="0.1" value="${b.q}"></label>
        </div>`).join("")}
      </div>`;
      drawEQ();
    } else {
      const map={
        nr:[["amount",t("nrAmt"),0,1,0.01],["enhance",t("enhance"),0,1,0.01],["hpf","HPF Hz",20,300,1],["voice",t("voicePres"),0,1,0.01],["detail",t("detailPres"),0,1,0.01]],
        hum:[["freq","50/60",50,60,10],["harmonics","Harmonics",1,5,1],["amount",t("nrAmt"),0,1,0.01]],

        deess:[["f","Hz",2000,12000,10],["thr","Thr",-40,-6,0.5],["amt","Amt",0,1,0.01],["range","Range",1000,8000,10]],
        comp:[["thr","Thr",-60,0,0.5],["ratio","Ratio",1,20,0.1],["atk","Atk",0.001,0.2,0.001],["rel","Rel",0.02,1,0.01],["knee","Knee",0,40,1],["makeup","Makeup",0,24,0.1]],
        sat:[["drive",t("drive"),0,1,0.01],["mix",t("mix"),0,1,0.01]],
        reverb:[["pre","Pre",0,0.12,0.001],["decay","Decay",0.2,5,0.05],["damp","Damp",0,1,0.01],["size","Size",0.1,1,0.01],["mix",t("mix"),0,1,0.01],["width",t("width"),0,1,0.01]],
        delay:[["time","Time",0.01,1.2,0.01],["fb","FB",0,0.9,0.01],["mix",t("mix"),0,1,0.01],["width",t("width"),0,1,0.01],["lc","Low cut",20,800,1],["hc","High cut",2000,18000,10]],
        limit:[["thr","Thr",-12,0,0.1],["ceil","Ceiling",-3,0,0.1],["rel","Rel",0.01,0.4,0.01],["inGain","Input",-12,12,0.1]],
      };
      const spec=map[S.fxTab];
      const obj=f[S.fxTab];
      const knobs=(spec||[]).slice(0,6).map(([k,lb,min,max])=>{
        const p=(obj[k]-min)/((max-min)||1);
        const ang=-135+p*270;
        return `<div class="knob"><div class="knob-ui" data-k="${k}" data-min="${min}" data-max="${max}"><b style="transform:rotate(${ang}deg)"></b></div><label>${lb}</label><div class="kv">${(+obj[k]).toFixed(2)}</div></div>`;
      }).join("");
      box.innerHTML=`<div class="fx-mod"><h4>${S.fxTab.toUpperCase()} ${onToggle(obj)}</h4>
        ${S.fxTab==="sat"?`<label class="field">Type <select id="satType"><option ${obj.type==="tube"?"selected":""}>tube</option><option ${obj.type==="tape"?"selected":""}>tape</option><option ${obj.type==="soft"?"selected":""}>soft</option><option ${obj.type==="warm"?"selected":""}>warm</option></select></label>`:""}
        ${S.fxTab==="reverb"?`<label class="field">Type <select id="rvType">${["room","hall","studio","plate","cathedral","amb"].map(x=>`<option value="${x}" ${obj.type===x?"selected":""}>${x}</option>`).join("")}</select></label>`:""}
        ${S.fxTab==="hum"?`<div class="row"><button class="btn" data-hz="50">50 Hz</button><button class="btn" data-hz="60">60 Hz</button></div>`:""}
        ${S.fxTab==="nr"?`<div class="row"><button class="btn" data-str="light">${t("nrLight")}</button><button class="btn" data-str="medium">${t("nrMed")}</button><button class="btn" data-str="strong">${t("nrStrong")}</button></div>
        <button class="btn" id="applyNR">${t("apply")} Spectral NR (DSP)</button><p class="notice">${t("localMode")}</p>`:""}
        <div class="knob-row" style="margin:10px 0">${knobs}</div>
        ${spec.map(([k,lb,min,max,st])=>`<label class="field" style="margin-top:8px">${lb} <b style="color:var(--text)">${(+obj[k]).toFixed(st<1?2:0)}</b>
          <input type="range" data-p="${S.fxTab}.${k}" min="${min}" max="${max}" step="${st}" value="${obj[k]}"></label>`).join("")}
      </div>`;
      if($("satType")) $("satType").onchange=()=>{ f.sat.type=$("satType").value; AudioEngine.applyParams(); };
      if($("rvType")) $("rvType").onchange=()=>{ f.reverb.type=$("rvType").value; AudioEngine.applyParams(); };
      box.querySelectorAll("[data-hz]").forEach(b=>b.onclick=()=>{ f.hum.freq=+b.dataset.hz; AudioEngine.applyParams(); this.renderInspector(); });
      box.querySelectorAll("[data-str]").forEach(b=>b.onclick=()=>{ const m={light:.22,medium:.45,strong:.72}; f.nr.amount=m[b.dataset.str]; f.nr.strength=b.dataset.str; f.nr.on=true; AudioEngine._wire(); this.renderInspector(); });
      if($("applyNR")) $("applyNR").onclick=()=>{
        if(!AudioEngine.buffer) return;
        toast(t("largeFile"));
        setTimeout(()=>{
          AudioEngine.snapshot();
          AudioEngine.buffer=spectralNR(AudioEngine.buffer, f.nr.amount, S.hasSel?Math.min(S.selA,S.selB):0, S.hasSel?Math.abs(S.selB-S.selA):0.5);
          Waveform.rebuild(); toast(t("applied"));
        },30);
      };
      box.querySelectorAll(".knob-ui").forEach(el=>{
        let last=null;
        el.onpointerdown=e=>{ last=e.clientY; el.setPointerCapture(e.pointerId); FxHistory.push(); };
        el.onpointermove=e=>{
          if(last==null) return;
          const k=el.dataset.k, min=+el.dataset.min, max=+el.dataset.max;
          const span=max-min;
          obj[k]=clamp(obj[k]-(e.clientY-last)*span/140, min, max);
          last=e.clientY; AudioEngine.applyParams();
          el.nextElementSibling.nextElementSibling.textContent=(+obj[k]).toFixed(2);
          const p=(obj[k]-min)/span; el.querySelector("b").style.transform=`rotate(${-135+p*270}deg)`;
        };
        el.onpointerup=()=>last=null;
        el.ondblclick=()=>{ obj[el.dataset.k]=(+el.dataset.min+ +el.dataset.max)/2; AudioEngine.applyParams(); this.renderInspector(); };
      });
    }
    box.querySelectorAll("[data-en]").forEach(el=>el.onclick=()=>{
      FxHistory.push(); f[S.fxTab].on=!f[S.fxTab].on; AudioEngine._wire(); this.renderInspector();
    });
    box.querySelectorAll("[data-band]").forEach(el=>el.onclick=()=>{
      f.eq.bands[+el.dataset.band].on=!f.eq.bands[+el.dataset.band].on; AudioEngine._wire(); this.renderInspector();
    });
    box.querySelectorAll("input[type=range]").forEach(el=>{
      el.oninput=()=>{
        if(el.dataset.eq!=null){
          const i=+el.dataset.eq, k=el.dataset.k; f.eq.bands[i][k]=+el.value; AudioEngine.applyParams(); drawEQ();
        } else if(el.dataset.p){
          const [m,k]=el.dataset.p.split("."); f[m][k]=+el.value; AudioEngine.applyParams();
        }
      };
    });
  }
};

function cfgLabel(k){
  const m={denoise:"Spectral DSP / API",voice:"Presence + NR",clarity:"EQ presence",dereverb:"Needs API · HP+gate fallback",hum:"Notch 50/60",balance:"Normalize + limiter",repair:"DSP chain / API",master:"Quran Studio chain"};
  return m[k]||"DSP";
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

const EQDrag={i:-1};
function fToX(f,W){ return Math.log(Math.max(20,f)/20)/Math.log(1000)*W; }
function xToF(x,W){ return 20*Math.pow(1000, clamp(x/W,0,1)); }
function drawEQ(){
  const c=$("eqCan"); if(!c) return;
  const dpr=devicePixelRatio||1;
  const r=c.getBoundingClientRect();
  if(!r.width) return;
  c.width=r.width*dpr; c.height=r.height*dpr;
  const g=c.getContext("2d"); g.scale(dpr,dpr);
  const W=r.width,H=r.height;
  g.fillStyle="#07090e"; g.fillRect(0,0,W,H);
  g.strokeStyle="rgba(255,255,255,.06)";
  [-12,0,12].forEach(dbv=>{ const y=H/2-dbv/24*H/2; g.beginPath(); g.moveTo(0,y); g.lineTo(W,y); g.stroke(); });
  if(!AudioEngine.nodes) return;
  const freqs=new Float32Array(256);
  for(let i=0;i<256;i++) freqs[i]=20*Math.pow(1000,i/255);
  const mag=new Float32Array(256), ph=new Float32Array(256);
  const acc=new Float32Array(256); acc.fill(1);
  AudioEngine.nodes.eq.forEach((f,i)=>{
    if(!S.fx.eq.bands[i].on) return;
    f.getFrequencyResponse(freqs,mag,ph);
    for(let k=0;k<256;k++) acc[k]*=mag[k];
  });
  g.beginPath(); g.strokeStyle="#4ad4e0"; g.lineWidth=2;
  for(let i=0;i<256;i++){
    const dbv=20*Math.log10(acc[i]+1e-9);
    const x=i/255*W, y=H/2 - dbv/24*H/2;
    i?g.lineTo(x,y):g.moveTo(x,y);
  }
  g.stroke();
  S.fx.eq.bands.forEach((b,i)=>{
    if(!b.on) return;
    const x=fToX(b.f,W), y=H/2 - b.g/24*H/2;
    g.beginPath(); g.fillStyle=EQDrag.i===i?"#d4b36a":"#4ad4e0"; g.arc(x,y,7,0,Math.PI*2); g.fill();
  });
  if(!c._eqBound){
    c._eqBound=true;
    c.addEventListener("pointerdown",e=>{
      const rr=c.getBoundingClientRect(); const x=e.clientX-rr.left, y=e.clientY-rr.top;
      let best=-1, bd=99;
      S.fx.eq.bands.forEach((b,i)=>{ const px=fToX(b.f,rr.width), py=rr.height/2-b.g/24*rr.height/2; const d=Math.hypot(px-x,py-y); if(d<bd&&d<20){bd=d;best=i;} });
      EQDrag.i=best; if(best>=0) c.setPointerCapture(e.pointerId);
    });
    c.addEventListener("pointermove",e=>{
      if(EQDrag.i<0) return;
      const rr=c.getBoundingClientRect(); const b=S.fx.eq.bands[EQDrag.i];
      b.f=clamp(xToF(e.clientX-rr.left,rr.width),20,20000);
      b.g=clamp(((rr.height/2)-(e.clientY-rr.top))/(rr.height/2)*24,-18,18);
      AudioEngine.applyParams(); drawEQ();
    });
    c.addEventListener("pointerup",()=>EQDrag.i=-1);
  }
}

function drawRecWave(){
  const c=$("recWave"); if(!c) return;
  const g=c.getContext("2d");
  c.width=c.clientWidth*devicePixelRatio; c.height=c.clientHeight*devicePixelRatio;
  g.fillStyle="#07090e"; g.fillRect(0,0,c.width,c.height);
  g.strokeStyle="#3ec8d8"; g.beginPath();
  const frames=Rec.live||[];
  const last=frames[frames.length-1];
  if(!last) return;
  for(let i=0;i<last.length;i+=Math.ceil(last.length/c.width)){
    const x=i/last.length*c.width, y=(0.5-last[i]*0.45)*c.height;
    i?g.lineTo(x,y):g.moveTo(x,y);
  }
  g.stroke();
  if(Rec.ana){
    const td=new Uint8Array(Rec.ana.fftSize);
    Rec.ana.getByteTimeDomainData(td);
    let pk=0,s2=0;
    for(let i=0;i<td.length;i++){ const v=(td[i]-128)/128; pk=Math.max(pk,Math.abs(v)); s2+=v*v; }
    const rms=Math.sqrt(s2/td.length);
    if($("recLvl")) $("recLvl").style.width=(pk*100)+"%";
    if($("recPeak")) $("recPeak").textContent="PEAK "+db(pk);
    if($("recRms")) $("recRms").textContent="RMS "+db(rms);
    if($("recClip")) $("recClip").style.display=pk>0.99?"inline-block":"none";
  }
}

function updateMeta(){ UI.renderTools(); UI.renderDash(); }

function showView(id){
  if(id==="eq"||id==="dynamics"||id==="reverb"||id==="delay"||id==="nr"){
    S.fxTab = id==="dynamics"?"comp":id; S.view="editor";
  } else S.view=id;
  const side=["editor","plugins"].includes(S.view);
  $("app").classList.toggle("no-side", !side && S.view!=="editor");
  if(S.view==="editor") $("app").classList.remove("no-side");
  document.querySelectorAll(".view").forEach(v=>v.classList.toggle("on", v.id==="view-"+S.view));
  UI.renderNav();
  if(S.view==="editor") setTimeout(()=>Waveform.draw(),40);
  if(S.view==="record") UI.renderRecord();
    if(S.view==="ailab") UI.renderAI();
    if(S.view==="quran") UI.renderQuran();
}

/* ---------- Meters RAF ---------- */
const tdOut=new Uint8Array(2048);
const fd=new Uint8Array(1024);
function tick(){
  Waveform.draw();
  const spec=$("spec");
  const big=$("specBig");
  if(AudioEngine.outAnalyser){
    AudioEngine.outAnalyser.getByteTimeDomainData(tdOut);
    AudioEngine.outAnalyser.getByteFrequencyData(fd);
    let pk=0,s2=0;
    for(let i=0;i<tdOut.length;i++){ const v=(tdOut[i]-128)/128; pk=Math.max(pk,Math.abs(v)); s2+=v*v; }
    const rms=Math.sqrt(s2/tdOut.length);
    AudioEngine.peak=pk; AudioEngine.rms=rms;
    $("mOut").style.width=(Math.min(1,pk)*100)+"%";
    $("mIn").style.width=(Math.min(1,pk*0.9)*100)+"%";
    if(AudioEngine.nodes&&AudioEngine.nodes.comp){
      const red=Math.min(1, Math.abs(AudioEngine.nodes.comp.reduction)/30);
      $("mGr").style.width=(red*100)+"%";
    }
    $("clipLed").classList.toggle("on", pk>0.99);
    $("vPeak").textContent=db(pk);
    $("vRms").textContent=db(rms);
    // approx LUFS from RMS with K-weight-ish offset
    const m=rms>0? -0.691+20*Math.log10(rms)-0.7 : -70;
    AudioEngine.mBuf.push(m); if(AudioEngine.mBuf.length>30) AudioEngine.mBuf.shift();
    AudioEngine.sBuf.push(m); if(AudioEngine.sBuf.length>180) AudioEngine.sBuf.shift();
    const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
    const mm=avg(AudioEngine.mBuf), ss=avg(AudioEngine.sBuf);
    $("vM").textContent=isFinite(mm)?mm.toFixed(1):"-∞";
    $("vS").textContent=isFinite(ss)?ss.toFixed(1):"-∞";
    if(S.playing){ AudioEngine.iSum+=m; AudioEngine.iCount++; }
    const ii=AudioEngine.iCount? AudioEngine.iSum/AudioEngine.iCount : -70;
    $("vI").textContent=isFinite(ii)?ii.toFixed(1):"-∞";
    const flag=$("loudFlag");
    if(flag){
      const pkdb=pk>1e-8?20*Math.log10(pk):-90;
      if(pkdb>-1){ flag.textContent=t("tooLoud"); flag.className="loud-flag hot"; }
      else if(pkdb<-24 && !S.playing){ flag.textContent=t("tooQuiet"); flag.className="loud-flag quiet"; }
      else if(pkdb<-18 && S.playing){ flag.textContent=t("tooQuiet"); flag.className="loud-flag quiet"; }
      else { flag.textContent=t("loudGood"); flag.className="loud-flag good"; }
    }
    drawSpec(spec, fd);
    if(big) drawSpec(big, fd, true);
  }
  if(S.view==="record" && S.recState==="live") drawRecWave();
  requestAnimationFrame(tick);
}
function drawSpec(c, fd, big){
  if(!c) return;
  const g=c.getContext("2d");
  const dpr=devicePixelRatio||1;
  const r=c.getBoundingClientRect();
  if(!r.width) return;
  c.width=r.width*dpr; c.height=r.height*dpr;
  g.fillStyle="#07090e"; g.fillRect(0,0,c.width,c.height);
  const n=fd.length;
  let peakB=0, peakI=0;
  for(let i=1;i<n;i++){
    const x=Math.log10(i)/Math.log10(n)*c.width;
    const h=fd[i]/255*c.height;
    g.fillStyle=`hsla(${200+fd[i]*0.3},80%,60%,.85)`;
    g.fillRect(x, c.height-h, Math.max(1,c.width/120), h);
    if(fd[i]>peakB){peakB=fd[i]; peakI=i;}
  }
  if(big && AudioEngine.ctx){
    const hz=peakI*AudioEngine.ctx.sampleRate/(AudioEngine.outAnalyser.fftSize);
    const el=$("peakF"); if(el) el.textContent=hz.toFixed(0)+" Hz";
  }
}

/* ---------- Events ---------- */
function bind(){
  $("langSeg").onclick=e=>{
    const b=e.target.closest("button"); if(!b) return;
    S.lang=b.dataset.lang; localStorage.setItem("osm_lang",S.lang); UI.applyLang();
  };
  $("themeBtn").onclick=()=>{ S.theme=S.theme==="dark"?"light":"dark"; UI.applyTheme(); };
  $("helpBtn").onclick=openHelp;
  $("btnUndo").onclick=undoAny;
  $("btnRedo").onclick=redoAny;
  $("btnSave").onclick=()=>saveProject();
  $("btnExportH").onclick=()=>showView("export");
  $("rateSel").onchange=()=>{ S.rate=parseFloat($("rateSel").value)||1; if(S.playing) AudioEngine.play(); };
  $("volMain").oninput=()=>{ S.mixer.master.vol=+$("volMain").value; AudioEngine.applyParams(); };
  $("btnMute").onclick=()=>{ S.mixer.master.mute=!S.mixer.master.mute; AudioEngine.applyParams(); $("btnMute").classList.toggle("on", S.mixer.master.mute); };
  $("modal").onclick=e=>{ if(e.target.id==="modal") $("modal").classList.remove("on"); };
  $("projName").onchange=()=>S.projectName=$("projName").value.trim()||"Untitled Project";
  $("btnPlay").onclick=()=>S.playing?AudioEngine.pause():AudioEngine.play();
  $("btnStop").onclick=()=>AudioEngine.stop();
  $("btnLoop").onclick=()=>{ S.looping=!S.looping; UI.playBtn(); };
  $("btnAB").onclick=()=>{ S.compare=!S.compare; AudioEngine._wire(); UI.playBtn(); toast(t("holdAB")); };
  $("btnRec").onclick=()=>showView("record");
  $("bypassAll").onclick=()=>{ S.bypassAll=!S.bypassAll; AudioEngine._wire(); $("bypassAll").classList.toggle("primary", S.bypassAll); };
  $("resetFx").onclick=()=>{ if(confirm(t("confirmReset"))){ S.fx=defaultFx(); AudioEngine._wire(); UI.renderInspector(); } };
  $("btnImport").onclick=()=>$("fileAudio").click();
  $("btnImportVid").onclick=()=>$("fileVideo").click();
  $("fileAudio").onchange=e=>importFile(e.target.files[0]);
  $("fileVideo").onchange=e=>importFile(e.target.files[0]);
  $("waveEmpty").addEventListener("click",e=>{ if(e.target.closest("button")) return; $("fileAudio").click(); });

  const wave=$("wave");
  let dragging=false, mode="seek";
  wave.addEventListener("pointerdown",e=>{
    if(!AudioEngine.buffer) return;
    wave.setPointerCapture(e.pointerId);
    const t0=Waveform.xToTime(e.clientX);
    if(e.shiftKey){ mode="sel"; S.selA=t0; S.selB=t0; S.hasSel=true; }
    else { mode="seek"; AudioEngine.seek(t0); }
    dragging=true;
  });
  wave.addEventListener("pointermove",e=>{
    if(!dragging||!AudioEngine.buffer) return;
    const t0=Waveform.xToTime(e.clientX);
    if(mode==="sel") S.selB=t0; else AudioEngine.seek(t0);
  });
  wave.addEventListener("pointerup",()=>dragging=false);
  wave.addEventListener("wheel",e=>{
    if(!AudioEngine.buffer) return;
    e.preventDefault();
    if(e.ctrlKey||e.metaKey){
      const t0=Waveform.xToTime(e.clientX);
      S.zoom=clamp(S.zoom*(e.deltaY>0?0.85:1.18),1,64);
      const view=AudioEngine.buffer.duration/S.zoom;
      S.scroll=clamp(t0-view/2,0,AudioEngine.buffer.duration-view);
    } else {
      const view=AudioEngine.buffer.duration/S.zoom;
      S.scroll=clamp(S.scroll + Math.sign(e.deltaY)*view*0.08, 0, Math.max(0,AudioEngine.buffer.duration-view));
    }
  },{passive:false});

  window.addEventListener("dragover",e=>{ e.preventDefault(); $("dropOverlay").classList.add("on"); });
  window.addEventListener("dragleave",e=>{ if(e.relatedTarget===null) $("dropOverlay").classList.remove("on"); });
  window.addEventListener("drop",e=>{
    e.preventDefault(); $("dropOverlay").classList.remove("on");
    const f=e.dataTransfer.files[0]; if(f) importFile(f);
  });

  window.addEventListener("keydown",e=>{
    const tag=(e.target.tagName||"").toLowerCase();
    if(tag==="input"||tag==="textarea"||tag==="select") return;
    const mod=e.ctrlKey||e.metaKey;
    if(e.code==="Space"){ e.preventDefault(); S.playing?AudioEngine.pause():AudioEngine.play(); }
    else if(e.key==="r"||e.key==="R"){ showView("record"); }
    else if(e.key==="m"||e.key==="M"){ S.mixer.master.mute=!S.mixer.master.mute; AudioEngine.applyParams(); }
    else if(e.key==="s"||e.key==="S"){ if(!mod){ S.mixer.master.solo=!S.mixer.master.solo; } }
    if(mod && e.key.toLowerCase()==="z"){ e.preventDefault(); e.shiftKey?AudioEngine.doRedo():AudioEngine.doUndo(); }
    if(mod && e.key.toLowerCase()==="s"){ e.preventDefault(); saveProject(); }
    if(mod && e.key.toLowerCase()==="c"){ e.preventDefault(); copySel(); }
    if(mod && e.key.toLowerCase()==="x"){ e.preventDefault(); cutSel(); }
    if(mod && e.key.toLowerCase()==="v"){ e.preventDefault(); pasteAt(); }
  });
  window.addEventListener("resize",()=>Waveform.draw());
}

/* ---------- Boot ---------- */
async function boot(){
  try{ await IDB.open(); }catch(e){}
  UI.applyTheme();
  UI.applyLang();
  bind();
  requestAnimationFrame(tick);
  setTimeout(()=>{
    $("splash").classList.add("hide");
    $("app").classList.add("ready");
  }, 1400);
}
boot();
})();
